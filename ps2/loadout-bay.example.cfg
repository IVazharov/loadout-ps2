# Loadout Bay network settings.
# Copy this file next to loadout-bay.elf and rename it to loadout-bay.cfg.
# Without that file, Loadout Bay uses DHCP.
# With dhcp=on, the addresses below are ignored.
dhcp=off
ip=192.168.1.50
netmask=255.255.255.0
gateway=192.168.1.1
# Exit starts this ELF instead of returning to the PS2's menu. Leave it out for the menu.
# exit=mc0:/APPS/OPNPS2LD.ELF
